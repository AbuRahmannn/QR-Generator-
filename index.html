<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>QR Studio Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0b1120;
    --card:#111827;
    --border:rgba(255,255,255,.08);
    --text:#f8fafc;
    --muted:#94a3b8;
    --primary:#6366f1;
    --secondary:#8b5cf6;
    --success:#22c55e;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at top left,#4338ca 0%,transparent 40%),
    radial-gradient(circle at bottom right,#7c3aed 0%,transparent 40%),
    var(--bg);

    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:1400px;
    max-width:100%;
    display:grid;
    grid-template-columns:520px 1fr;
    gap:30px;
}

.panel{
    background:rgba(17,24,39,.8);
    backdrop-filter:blur(20px);
    border:1px solid var(--border);
    border-radius:28px;
    padding:35px;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:30px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.logo h1{
    font-size:28px;
    font-weight:800;
}

.logo p{
    color:var(--muted);
    font-size:14px;
}

.section{
    margin-top:25px;
}

label{
    display:block;
    margin-bottom:10px;
    font-size:14px;
    font-weight:600;
}

.input{
    width:100%;
    background:#0f172a;
    border:1px solid #1e293b;
    color:white;
    padding:15px;
    border-radius:14px;
    outline:none;
    transition:.3s;
}

.input:focus{
    border-color:var(--primary);
}

.color-group{
    display:flex;
    gap:15px;
}

.color-group input{
    height:60px;
    border:none;
    cursor:pointer;
    flex:1;
    border-radius:14px;
}

.upload-box{
    border:2px dashed #334155;
    padding:30px;
    border-radius:18px;
    text-align:center;
    transition:.3s;
}

.upload-box:hover{
    border-color:var(--primary);
}

.upload-box input{
    margin-top:10px;
}

.generate-btn{
    width:100%;
    margin-top:30px;
    border:none;
    border-radius:16px;
    padding:18px;
    font-size:16px;
    font-weight:700;
    color:white;
    cursor:pointer;

    background:linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));
}

.generate-btn:hover{
    transform:translateY(-2px);
}

.downloads{
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.downloads button{
    border:none;
    border-radius:14px;
    padding:15px;
    font-weight:600;
    cursor:pointer;
    background:#1e293b;
    color:white;
}

.preview-panel{
    display:flex;
    flex-direction:column;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.badge{
    background:rgba(34,197,94,.15);
    color:var(--success);
    padding:10px 18px;
    border-radius:50px;
    font-size:13px;
    font-weight:600;
}

.preview-card{
    flex:1;
    background:rgba(255,255,255,.03);
    border-radius:28px;
    border:1px solid var(--border);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:600px;
}

.placeholder{
    text-align:center;
}

.placeholder h2{
    margin-top:20px;
    font-size:26px;
}

.placeholder p{
    color:var(--muted);
    margin-top:10px;
}

.preview-card img{
    width:320px;
    border-radius:20px;
    background:white;
    padding:20px;
    animation:fade .4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:scale(.95);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

@media(max-width:1100px){

.container{
    grid-template-columns:1fr;
}

.preview-card{
    min-height:400px;
}

}

</style>
</head>
<body>

<div class="container">

<div class="panel">

<div class="logo">
<div class="logo-icon">⌁</div>

<div>
<h1>QR Studio Pro</h1>
<p>Enterprise QR Generator</p>
</div>
</div>

<div class="section">
<label>Website URL</label>
<input
type="text"
id="link"
class="input"
placeholder="https://example.com">
</div>

<div class="section">
<label>QR Styling</label>

<div class="color-group">
<input type="color" id="fill_color" value="#000000">
<input type="color" id="back_color" value="#ffffff">
</div>
</div>

<div class="section">
<label>Brand Logo</label>

<div class="upload-box">
📁 Drag & Drop Logo

<br><br>

<input type="file" id="logo">
</div>
</div>

<button
class="generate-btn"
onclick="previewQR()">
Generate QR Code
</button>

<div class="downloads">

<button onclick="downloadPNG()">
Download PNG
</button>

<button onclick="downloadSVG()">
Download SVG
</button>

</div>

</div>

<div class="panel preview-panel">

<div class="header">
<h2>Live Preview</h2>

<div class="badge">
● Ready
</div>
</div>

<div class="preview-card" id="preview">

<div class="placeholder">

<div style="font-size:70px">▣</div>

<h2>Your QR Code</h2>

<p>
Generate a QR code to see the preview here.
</p>

</div>

</div>

</div>

</div>

<script>

function previewQR(){

let formData=new FormData();

formData.append(
"link",
document.getElementById("link").value
);

formData.append(
"fill_color",
document.getElementById("fill_color").value
);

formData.append(
"back_color",
document.getElementById("back_color").value
);

let logo=
document.getElementById("logo").files[0];

if(logo){
formData.append("logo",logo);
}

fetch('/preview',{
method:'POST',
body:formData
})
.then(res=>res.json())
.then(data=>{

if(data.error){
alert(data.error);
return;
}

document.getElementById("preview").innerHTML=
`
<img
src="data:image/png;base64,${data.image}">
`;

});

}

function downloadPNG(){

let form=new FormData();

form.append(
"link",
document.getElementById("link").value
);

fetch('/download_png',{
method:'POST',
body:form
})
.then(res=>res.blob())
.then(blob=>{

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="qr_code.png";

a.click();

});
}

function downloadSVG(){

let form=new FormData();

form.append(
"link",
document.getElementById("link").value
);

fetch('/download_svg',{
method:'POST',
body:form
})
.then(res=>res.blob())
.then(blob=>{

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="qr_code.svg";

a.click();

});
}

</script>

</body>
</html>
