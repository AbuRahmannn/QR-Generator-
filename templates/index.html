<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>QR Studio Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="container">

<div class="panel">

<div class="logo">
<div class="logo-icon">⌁</div>

<div>
<h1>QR Studio Pro</h1>
<p>Enterprise QR Generator</p>
</div>
</div>

<div class="section">
<label>Website URL</label>
<input
type="text"
id="link"
class="input"
placeholder="https://example.com">
</div>

<div class="section">
<label>QR Styling</label>

<div class="color-group">
<input type="color" id="fill_color" value="#000000">
<input type="color" id="back_color" value="#ffffff">
</div>
</div>

<div class="section">
<label>Brand Logo</label>

<div class="upload-box">
📁 Drag & Drop Logo

<br><br>

<input type="file" id="logo">
</div>
</div>

<button
class="generate-btn"
onclick="previewQR()">
Generate QR Code
</button>

<div class="downloads">

<button onclick="downloadPNG()">
Download PNG
</button>

<button onclick="downloadSVG()">
Download SVG
</button>

</div>

</div>

<div class="panel preview-panel">

<div class="header">
<h2>Live Preview</h2>

<div class="badge">
● Ready
</div>
</div>

<div class="preview-card" id="preview">

<div class="placeholder">

<div style="font-size:70px">▣</div>

<h2>Your QR Code</h2>

<p>
Generate a QR code to see the preview here.
</p>

</div>

</div>

</div>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
